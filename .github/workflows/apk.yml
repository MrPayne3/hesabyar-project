name: Generate PWA APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwabuilder-cli
      - name: Generate Android package
        run: |
          mkdir -p output
          # Generate manifest and APK metadata config
          npx @pwabuilder/pwabuilder-cli package --siteUrl https://mrpayne3.github.io/hesabyar-project/ --dir ./output || true
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-apk
          path: output/
